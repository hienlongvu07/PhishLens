<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300">
 <style>
  @keyframes nudge { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes line-draw { 0%,100% { stroke-dashoffset: 150; } 55%,85% { stroke-dashoffset: 0; } }
  @keyframes warning-pulse { 0%,100% { transform: scale(1); opacity: .84; } 50% { transform: scale(1.08); opacity: 1; } }
  .float-orbit { animation: nudge 5.5s ease-in-out infinite; }
  .commission-line { stroke-dasharray: 150; animation: line-draw 6s ease-in-out infinite; }
  .warning { transform-box: fill-box; transform-origin: center; animation: warning-pulse 3.8s 1s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
 </style>
