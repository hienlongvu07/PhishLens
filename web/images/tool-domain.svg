  <style>
    @keyframes scan { to { stroke-dashoffset: -120; } }
    @keyframes lens-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes ping { 0%,100% { opacity: .75; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
    .scan-ring { stroke-dasharray: 10 7; animation: scan 12s linear infinite; }
    .lens { animation: lens-float 4.8s ease-in-out infinite; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
