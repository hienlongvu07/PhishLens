  <style>
    @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes breathe { 0%,100% { opacity: .78; transform: scale(1); } 50% { opacity: 1; transform: scale(1.07); } }
    .sun { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; }
    .float-a { animation: drift 5s ease-in-out infinite; }
    .float-b { animation: drift 6s 1s ease-in-out infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: breathe 3.8s .4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
