  <path d="M235 118l14 10-14 10M411 118l14 10-14 10" fill="none" stroke="#72a891" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="node-one"><circle cx="80" cy="128" r="43" fill="#fffdf7" stroke="#cbded2" stroke-width="3"/><circle cx="80" cy="128" r="22" fill="#e6f1e7"/><path d="M80 114v15l10 6" fill="none" stroke="#377a66" stroke-width="5" stroke-linecap="round"/><path class="leaf" d="M52 76c1-15 12-23 27-20-1 14-10 22-27 20z" fill="#74aa8f"/></g>
  <g class="node-two"><circle cx="280" cy="128" r="50" fill="#dbeee3"/><circle cx="280" cy="128" r="38" fill="#fffdf7" stroke="#4c9077" stroke-width="3"/><circle cx="274" cy="122" r="13" fill="none" stroke="#387b66" stroke-width="5"/><path d="M284 132l14 14" stroke="#387b66" stroke-width="5" stroke-linecap="round"/><circle cx="304" cy="99" r="8" fill="#d77a5d"/></g>
  <g class="node-three"><circle cx="480" cy="128" r="43" fill="#fffdf7" stroke="#cbded2" stroke-width="3"/><path d="M480 101l20 8v17c0 13-10 22-20 27-10-5-20-14-20-27v-17z" fill="#4e987d"/><path d="M469 126l8 8 15-17" fill="none" stroke="#fffdf7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <path class="leaf" d="M163 196c2-16 14-24 30-21-2 15-12 23-30 21z" fill="#9ac4ab"/><path class="leaf" d="M420 204c2-13 11-19 24-17-1 12-9 18-24 17z" fill="#d69575"/>
</svg>
