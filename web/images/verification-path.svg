<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-hidden="true">
  <style>
    @keyframes route-flow { to { stroke-dashoffset: -80; } }
    @keyframes node-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    @keyframes leaf-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .route { stroke-dasharray: 8 9; animation: route-flow 9s linear infinite; }
    .node-one { transform-box: fill-box; transform-origin: center; animation: node-breathe 4.4s ease-in-out infinite; }
    .node-two { transform-box: fill-box; transform-origin: center; animation: node-breathe 4.4s 1.1s ease-in-out infinite; }
    .node-three { transform-box: fill-box; transform-origin: center; animation: node-breathe 4.4s 2.2s ease-in-out infinite; }
    .leaf { animation: leaf-float 5.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
  <rect width="560" height="260" rx="24" fill="#edf4ed"/>
  <circle cx="68" cy="194" r="36" fill="#dcefe5"/><circle cx="493" cy="62" r="26" fill="#f4dfb6"/>
