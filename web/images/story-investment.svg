 <style>
  @keyframes chart-breathe { 0%,100% { transform: scaleY(.96); } 50% { transform: scaleY(1.04); } }
  @keyframes profit-dash { 0%,100% { stroke-dashoffset: 72; } 45%,85% { stroke-dashoffset: 0; } }
  @keyframes fee-alert { 0%,100% { opacity: .78; } 50% { opacity: 1; } }
  .chart-bars { transform-box: fill-box; transform-origin: center bottom; animation: chart-breathe 5s ease-in-out infinite; }
  .profit-arrow { stroke-dasharray: 72; animation: profit-dash 5s ease-in-out infinite; }
  .fee-alert { animation: fee-alert 3.8s 1s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
 </style>
