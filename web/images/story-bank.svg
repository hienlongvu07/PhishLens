<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300">
 <style>
  @keyframes clock-tick { to { transform: rotate(360deg); } }
  @keyframes alert-breathe { 0%,100% { transform: scale(1); opacity: .82; } 50% { transform: scale(1.08); opacity: 1; } }
  .clock-hand { transform-box: view-box; transform-origin: 370px 166px; animation: clock-tick 60s linear infinite; }
  .alert-mark { transform-box: fill-box; transform-origin: center; animation: alert-breathe 3.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
 </style>
